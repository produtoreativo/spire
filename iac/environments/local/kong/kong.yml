_format_version: "3.0"
_transform: true

# SUPERSEDED by EXP-005 — Kong now runs in DB mode.
# Services, routes and plugins are configured via kong/init.sh (Admin API).
# This file is kept for historical reference (EXP-002 DB-less config).
#
# EXP-002: JWT validation disabled — auth is handled by Backstage + Keycloak OIDC.
# EXP-005: oidcify (JWT) + kong-opafy (OPA) plugins added via DB mode Admin API.

services:
  - name: backstage-api
    url: http://backstage:7007
    routes:
      - name: backstage-api-route
        hosts:
          - api.spire.localhost
        paths:
          - /backstage
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: spire-specs-api
    url: http://backstage:7007/api/spire
    routes:
      - name: spire-specs-route
        hosts:
          - api.spire.localhost
        paths:
          - /specs
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
      - name: request-size-limiting
        config:
          # OBCs e specs podem ser grandes (ex: OpenAPI com muitas operações)
          allowed_payload_size: 10

plugins:
  - name: correlation-id
    config:
      header_name: X-Spire-Request-ID
      generator: uuid#counter
      echo_downstream: true
