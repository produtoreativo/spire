_format_version: "3.0"
_transform: true

# Kong declarative config — DB-less mode (local dev / EXP-002)
#
# EXP-002: JWT validation disabled — auth is handled by Backstage + Keycloak OIDC.
# Kong handles routing, rate-limiting, and request tracing only.
# JWT plugin (Kong OSS) needs consumers with RS256 public keys pre-declared,
# which is not compatible with JWKS-only DB-less mode. Revisit in EXP-003
# using Kong OIDC plugin or Backstage-level auth enforcement.

services:
  - name: backstage-api
    url: http://backstage:7007
    routes:
      - name: backstage-api-route
        hosts:
          - api.spire.localhost
        paths:
          - /backstage
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: spire-specs-api
    url: http://backstage:7007/api/spire
    routes:
      - name: spire-specs-route
        hosts:
          - api.spire.localhost
        paths:
          - /specs
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
      - name: request-size-limiting
        config:
          # OBCs e specs podem ser grandes (ex: OpenAPI com muitas operações)
          allowed_payload_size: 10

plugins:
  - name: correlation-id
    config:
      header_name: X-Spire-Request-ID
      generator: uuid#counter
      echo_downstream: true
