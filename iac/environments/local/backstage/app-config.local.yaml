# EXP-004: Backstage config overrides for Spire local stack (HTTPS + Vault).
# Injected via --config app-config.local.yaml (takes precedence over app-config.yaml).
# Values with ${VAR} are resolved from the container environment at runtime.

app:
  title: Spire IDP (local)
  baseUrl: https://backstage.spire.localhost

backend:
  baseUrl: https://backstage.spire.localhost
  listen:
    host: "0.0.0.0"
    port: 7007
  cors:
    origin: https://backstage.spire.localhost
  # Static tokens for external services (pipelines) proxied through Kong.
  # Kong injects this token in the Authorization header after OPA approves.
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_PIPELINE_TOKEN}
          subject: spire-pipeline
  database:
    client: pg
    connection:
      host: postgres
      port: 5432
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  openTelemetry:
    serviceName: spire-backstage

auth:
  environment: development
  session:
    secret: ${AUTH_BACKEND_SECRET}
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    oidc:
      development:
        # metadataUrl via public HTTPS URL (routed through host-gateway → Traefik → Keycloak).
        # NODE_EXTRA_CA_CERTS trusts the local CA for this HTTPS request.
        metadataUrl: https://keycloak.spire.localhost/realms/spire/.well-known/openid-configuration
        clientId: backstage
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        callbackUrl: https://backstage.spire.localhost/api/auth/oidc/handler/frame
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
            - resolver: emailMatchingUserEntityProfileEmail

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: awsS3
    awsS3:
      bucketName: spire-artifacts
      region: us-east-1
      # Internal endpoint: SeaweedFS S3 is accessed directly (no TLS needed inside Docker network)
      endpoint: http://seaweedfs-s3:8333
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${SEAWEEDFS_ACCESS_KEY}
        secretAccessKey: ${SEAWEEDFS_SECRET_KEY}

vault:
  # Internal Vault URL (HTTP, inside Docker network — Traefik handles external TLS)
  baseUrl: http://vault:8200
  token: ${VAULT_TOKEN}
  secretEngine: secret
  kvVersion: 2

integrations:
  github:
    - host: github.com
      # Set GITHUB_TOKEN in .env to enable GitHub catalog ingestion (read:org, read:repo)
      token: ${GITHUB_TOKEN:-github-token-not-configured}

catalog:
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group]
  locations:
    - type: file
      target: /app/examples/entities.yaml
    - type: file
      target: /app/examples/org.yaml
      rules:
        - allow: [User, Group]

spireGovernance:
  apicurioUrl: ${APICURIO_URL:-http://apicurio:8080}
  kongAdminUrl: ${KONG_ADMIN_URL:-http://kong:8001}
  microcksUrl: ${MICROCKS_URL:-http://microcks:8080}
  pipelineToken: ${BACKSTAGE_PIPELINE_TOKEN}
