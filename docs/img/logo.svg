  <!-- Eixo central -->
  <line x1="110" y1="60" x2="110" y2="180" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Estrutura lateral -->
  <line x1="110" y1="75" x2="65" y2="165" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="75" x2="155" y2="165" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

  <!-- Barra horizontal da base -->
  <line x1="65" y1="165" x2="155" y2="165" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

  <!-- Nós da base -->
  <circle cx="65" cy="165" r="6" fill="#1A1A1A"/>
  <circle cx="155" cy="165" r="6" fill="#1A1A1A"/>
